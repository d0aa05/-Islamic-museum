<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> المتحف الأسلامي | Digital Museum</title>
    <style>
        :root {
            --primary-color: #8B5A2B;
            --bg-color: #f4f1ea;
            --text-color: #333;
            --card-bg: #fff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        body.dark-mode {
            --bg-color: #1a1a1a;
            --text-color: #f4f1ea;
            --card-bg: #2a2a2a;
            --primary-color: #d4a373;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--primary-color);
        }
        h1 { margin: 0; color: var(--primary-color); font-size: 1.8rem; }
        .controls button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin-left: 10px;
            transition: 0.3s;
        }
        .controls button:hover { opacity: 0.8; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .artifact-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .artifact-card:hover { transform: translateY(-5px); box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
        .artifact-card img { width: 100%; height: 250px; object-fit: cover; display: block; }
        .artifact-info { padding: 15px; text-align: center; }
        .artifact-info h3 { margin: 0 0 10px 0; color: var(--primary-color); font-size: 1.2rem; }
        .artifact-info p { margin: 0; font-size: 0.9rem; color: #777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* النافذة المنبثقة */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-content {
            background-color: var(--card-bg);
            border-radius: 10px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .modal-content img { width: 100%; max-height: 400px; object-fit: contain; background-color: #000; }
        .modal-details { padding: 20px; }
        .modal-details h2 { color: var(--primary-color); margin-top: 0; }
        
        /* تنسيق الوصف ليدعم الأسطر المتعددة */
        .modal-details p { 
            line-height: 1.6; 
            font-size: 1.1rem; 
            white-space: pre-line; 
        }
        
        /* تنسيقات الوسائط (فيديو وصوت) */
        .media-section { margin-bottom: 20px; display: none; }
        .media-section h3 { color: var(--primary-color); margin-bottom: 10px; font-size: 1.1rem; }
        .media-section video { width: 100%; border-radius: 8px; background-color: #000; }
        .media-section audio { width: 100%; margin-top: 10px; }
        .audio-section { margin-top: 20px; padding-top: 15px; border-top: 1px dashed #ccc; }

        .close-btn {
            position: absolute; top: 10px; left: 15px;
            background: rgba(255,255,255,0.8); border: none;
            font-size: 24px; cursor: pointer; border-radius: 50%;
            width: 35px; height: 35px; display: flex;
            justify-content: center; align-items: center; color: #333;
            z-index: 10;
        }
        body.dark-mode .close-btn { background: rgba(0,0,0,0.8); color: white; }
        html[dir="ltr"] .close-btn { left: auto; right: 15px; }
    </style>
</head>

        let currentLang = 'ar';

        function renderGallery() {
            const container = document.getElementById('gallery-container');
            container.innerHTML = '';
            
            artifactsData.forEach(artifact => {
                const title = currentLang === 'ar' ? artifact.titleAr : artifact.titleEn;
                const desc = currentLang === 'ar' ? artifact.descAr : artifact.descEn;
                
                // لو مفيش صورة، نستخدم صورة بديلة (Placeholder)
                const imgSrc = artifact.image ? artifact.image : 'https://via.placeholder.com/280x250/CCCCCC/FFFFFF?text=No+Image';

                const card = document.createElement('div');
                card.className = 'artifact-card';
                card.onclick = () => openModal(artifact);
                card.innerHTML = `
                    <img src="${imgSrc}" alt="${title}" loading="lazy">
                    <div class="artifact-info">
                        <h3>${title || ' '}</h3>
                        <p>${desc || ' '}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openModal(artifact) {
            const overlay = document.getElementById('modal-overlay');
            const modalImg = document.getElementById('modal-img');
            
            // 1. التعامل مع الصورة
            if (artifact.image && artifact.image !== "") {
                modalImg.src = artifact.image;
                modalImg.style.display = 'block';
            } else {
                modalImg.style.display = 'none';
                modalImg.src = '';
            }

            const modalTitle = document.getElementById('modal-title');
            const modalDesc = document.getElementById('modal-desc');
            
            // 2. التعامل مع العنوان
            if (artifact.titleAr || artifact.titleEn) {
                modalTitle.textContent = currentLang === 'ar' ? artifact.titleAr : artifact.titleEn;
                modalTitle.style.display = 'block';
            } else {
                modalTitle.style.display = 'none';
            }
            
            // 3. التعامل مع الوصف
            if (artifact.descAr || artifact.descEn) {
                modalDesc.textContent = currentLang === 'ar' ? artifact.descAr : artifact.descEn;
                modalDesc.style.display = 'block';
            } else {
                modalDesc.style.display = 'none';
            }

            const videoSection = document.getElementById('video-section');
            const audioSection = document.getElementById('audio-section');
            const modalVideo = document.getElementById('modal-video');
            const modalAudio = document.getElementById('modal-audio');

            // 4. التعامل مع الفيديو
            if (artifact.video && artifact.video !== "") {
                modalVideo.src = artifact.video;
                videoSection.style.display = 'block';
            } else {
                videoSection.style.display = 'none';
                modalVideo.src = '';
            }

            // 5. التعامل مع الصوت
            if (artifact.audio && artifact.audio !== "") {
                modalAudio.src = artifact.audio;
                audioSection.style.display = 'block';
            } else {
                audioSection.style.display = 'none';
                modalAudio.src = '';
            }

            overlay.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeModal(event) {
            const overlay = document.getElementById('modal-overlay');
            if (!event || event.target === overlay || event.target.classList.contains('close-btn')) {
                overlay.style.display = 'none';
                document.body.style.overflow = 'auto';
                
                // إيقاف تشغيل الفيديو والصوت عند الإغلاق
                document.getElementById('modal-video').pause();
                document.getElementById('modal-audio').pause();
            }
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('main-title').textContent = currentLang === 'ar' ? "المتحف الرقمي" : "Digital Museum";
            document.getElementById('lang-btn').textContent = currentLang === 'ar' ? "English" : "العربية";
            renderGallery();
        }

        function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }

        window.onload = () => { renderGallery(); };
